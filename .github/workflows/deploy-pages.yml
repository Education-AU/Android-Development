name: Deploy lessons to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@michelvhoward'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GH_TOKEN }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build Lesson01
        working-directory: Lesson01
        run: |
          node ../node_modules/@michelvhoward/templates/build.js --project
          mkdir -p ../site/Lesson01/slides
          cp -R dist/. ../site/Lesson01/slides/
          cp ../site/Lesson01/slides/slides.html ../site/Lesson01/slides/index.html
      - name: Build Lesson02
        working-directory: Lesson02
        run: |
          node ../node_modules/@michelvhoward/templates/build.js --project
          mkdir -p ../site/Lesson02/slides
          cp -R dist/. ../site/Lesson02/slides/
          cp ../site/Lesson02/slides/slides.html ../site/Lesson02/slides/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
